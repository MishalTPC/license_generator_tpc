name: Build Windows licence generator
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,test,build]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TPC_Licence_Generator --add-data "assets;assets" run_admin.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TPC_Licence_Generator_Windows_v0.1.0
          path: dist/TPC_Licence_Generator.exe
          if-no-files-found: error

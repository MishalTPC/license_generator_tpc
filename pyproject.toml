[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpc-universal-licensing"
version = "0.1.0"
description = "The Project Company offline, machine-locked annual software licensing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mishal Mohanlal"}]
dependencies = ["cryptography>=43,<49"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
build = ["pyinstaller>=6.10,<7"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["tpc_licensing*"]
